apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus-stack:9090
    isDefault: true
  - name: Loki
    type: loki
    access: proxy
    url: http://loki-stack:3100
  - name: InfluxDB
    type: influxdb
    access: proxy
    url: http://influxdb-stack:8086
    jsonData:
      version: Flux
      organization: imgfastler
      defaultBucket: docker
      tlsSkipVerify: true
    secureJsonData:
      token: imgfastler-telemetry-token
