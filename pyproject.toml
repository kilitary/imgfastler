[project]
name = "imgfastler"
version = "1.0.0"
description = "Docker Desktop extension for browsing images and creating containers"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.29,<1.0",
  "docker>=7.0,<8.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8.0",
  "mypy>=1.0.0",
  "pytest>=8.0",
  "httpx>=0.27",  # fastapi.testclient
]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
